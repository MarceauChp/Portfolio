    <!-- Theme initialization script (prevents flash of wrong theme, default is light retro beige) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
